name: Daily Attendance Check

on:
  # schedule:              <-- COMMENTED OUT (Paused)
  #   - cron: '0 2 * * *'
  #   - cron: '30 10 * * *'
  workflow_dispatch:       # <-- KEPT ACTIVE (So you can still click "Run" button manually)

jobs:
  check_attendance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Scraper
        env:
          SLCM_STATE: ${{ secrets.SLCM_STATE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node index.js

      - name: Commit Updated Data
        run: |
          git config --global user.name 'SLCM-Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add data.json history.csv
          git commit -m "Update attendance records" || exit 0
          git push
