name: Daily Attendance Check

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 8:00 AM IST
    - cron: '30 10 * * 1-5'  # 4:00 PM IST
  workflow_dispatch:

jobs:
  check_attendance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Scraper
        env:
          SLCM_STATE: ${{ secrets.SLCM_STATE }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: node index.js

      # --- 📸 SAVES THE SCREENSHOT IF IT CRASHES ---
      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: error.png

      - name: Commit Updated Data
        run: |
          git config --global user.name 'SLCM-Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add data.json history.csv
          git commit -m "Update attendance records" || exit 0
          git push
